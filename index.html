  <body>
    <!-- Anti-FOUC: apply design layout & theme synchronously before React renders -->
    <script>
      (function() {
        try {
          var layout = localStorage.getItem('day_default_design_layout') || 'classic';
          var theme  = localStorage.getItem('day_design_theme') || 'organic';
          if (layout === 'alternative') {
            document.body.classList.add('layout-alternative');
          }
          document.body.classList.add('theme-' + theme);
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
